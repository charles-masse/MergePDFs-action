on: [push]

jobs:
  build:
    name: CombinePDFS
    runs-on: ubuntu-latest
    env:
      path: resources
      filename: example
    steps:
      - uses: actions/checkout@v7
      - uses: charles-masse/MergePDFs-action@1.1
        with:
          path: ${{env.path}}
          filename: ${{env.filename}}
      - name: Upload combined pdf
        uses: actions/upload-artifact@v7
        with:
          name: ${{env.filename}}
          path: ${{env.path}}/${{env.filename}}.pdf
